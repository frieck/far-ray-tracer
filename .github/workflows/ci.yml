# Checks every push to main on the systems the app ships for, including the ones nobody on the
# project has at hand: Windows and Intel Macs.
#
# On each system it runs the engine's tests, fetches Open Image Denoise as the release does, and
# renders every example scene with the command line, small and denoised. It fails if a scene
# does not render or if Open Image Denoise does not load, which would leave the app on the
# built-in filter. The app's window itself is not tested here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            runner: macos-latest
            oidn: macos-arm64
          - name: macOS (Intel)
            runner: macos-15-intel
            oidn: macos-x86_64
          - name: Windows
            runner: windows-latest
            oidn: windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-${{ matrix.oidn }}
      - name: Test the engine
        # far-gpu compares a GPU render with the CPU's where the runner has a graphics card.
        run: cargo test --release -p far-core -p far-cli -p far-gpu
      - name: Fetch Open Image Denoise
        shell: bash
        run: tools/fetch_oidn.sh ${{ matrix.oidn }}
      - name: Render every example, denoised
        shell: bash
        run: tools/smoke.sh
