[workspace]
members = ["crates/far-core", "crates/far-cli", "src-tauri"]
resolver = "2"

[workspace.package]
version = "3.0.0-beta.2"
edition = "2021"
license = "MIT"
authors = ["FARSystems"]
homepage = "https://farsystems.com.br"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

# The engine stays optimized in dev builds: without this, renders run dozens of times slower.
[profile.dev.package.far-core]
opt-level = 3
